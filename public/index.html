<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Composition Tool Beta · AI 帮你重新构图</title>
<style>
  :root { --bg:#0b0e13; --fg:#e8ecf1; --sub:#9aa4b2; --line:#232a35; --accent:#8ab4c8; --ok:#8fc7a6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:"Source Han Serif SC","Noto Serif SC",-apple-system,serif; min-height:100vh; }
  header { padding:26px 20px 10px; text-align:center; }
  h1 { font-size:1.45rem; font-weight:600; }
  h1 span { color:var(--accent); }
  .sub { color:var(--sub); font-size:.84rem; margin-top:5px; }
  main { max-width:680px; margin:0 auto; padding:10px 16px 60px; }
  .card { background:#11151c; border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; }
  .drop { border:1.5px dashed var(--line); border-radius:12px; padding:30px 14px; text-align:center; color:var(--sub); cursor:pointer; }
  .drop:hover { border-color:var(--accent); }
  .drop input { display:none; }
  .btn { background:var(--accent); color:#0b0e13; border:none; border-radius:10px; padding:13px 22px; font-size:1rem; font-weight:600; cursor:pointer; width:100%; margin-top:12px; font-family:inherit; }
  .btn:disabled { opacity:.4; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .status { color:var(--sub); font-size:.85rem; margin-top:10px; min-height:1.2em; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .compare figure { position:relative; }
  .compare img, .compare canvas { width:100%; border-radius:10px; display:block; border:1px solid var(--line); }
  .compare figcaption { text-align:center; font-size:.78rem; color:var(--sub); margin-top:6px; }
  .schemes { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .scheme { border:1.5px solid var(--line); border-radius:10px; padding:10px 6px; text-align:center; cursor:pointer; }
  .scheme.active { border-color:var(--accent); background:rgba(138,180,200,.08); }
  .scheme b { display:block; font-size:.9rem; }
  .scheme span { font-size:.72rem; color:var(--sub); }
  .explain { margin-top:12px; font-size:.9rem; line-height:1.9; color:var(--fg); }
  .explain b { color:var(--accent); }
  .foot { text-align:center; color:var(--sub); font-size:.76rem; margin-top:32px; line-height:1.8; }
  .foot a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>AI 帮你重新构图 <span>Beta</span></h1>
  <div class="sub">随手一拍 → AI 摄影师帮你裁到最好看 · 全程本机推理 · 永久免费</div>
</header>
<main>
  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" capture="environment">
      <div>📱 随手拍一张 / 选一张照片<br><span style="font-size:.76rem">不会构图也没关系，AI 来 · 图像不上传</span></div>
    </label>
    <button class="btn" id="go" disabled>✨ 一键构图</button>
    <div class="status" id="status"></div>
  </div>
  <div id="result" style="display:none">
    <div class="card">
      <div class="compare">
        <figure><canvas id="cBefore"></canvas><figcaption>你拍到的</figcaption></figure>
        <figure><canvas id="cAfter"></canvas><figcaption>AI 帮你拍到的</figcaption></figure>
      </div>
      <div class="explain" id="explain"></div>
      <div class="schemes" id="schemes"></div>
      <button class="btn ghost" id="save">💾 保存这张成片</button>
    </div>
  </div>
  <div class="foot">
    全部推理在本机浏览器完成 · 模型: MediaPipe (Apache-2.0) ·
    <a href="https://github.com/yyds8170-ctrl/ai-composition-tool-beta">GitHub</a> · MIT · 永久免费
  </div>
</main>
<script type="module">
const $ = id => document.getElementById(id);
let bmp = null, models = null, plans = [], activePlan = 0;
const HF = "https://huggingface.co/jkyy";
const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  bmp = await createImageBitmap(f);
  $("result").style.display = "none";
  $("go").disabled = false; $("go").textContent = "✨ 一键构图";
  status("照片就绪 · 点击一键构图");
});
function status(t) { $("status").textContent = t; }

async function loadModels() {
  if (models) return models;
  status("首次加载 AI 视觉模型（约 3-8 秒，之后离线可用）…");
  const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
  const fs = await vision.FilesetResolver.forVisionTasks(WASM);
  const mk = (u, k, ex) => vision[k].createFromOptions(fs, { baseOptions: { modelAssetPath: u, delegate: "GPU" }, runningMode: "IMAGE", ...ex });
  const [face, pose] = await Promise.all([
    mk(HF + "/actb-face-landmarker/resolve/main/face_landmarker.task", "FaceLandmarker", { numFaces: 3 }),
    mk(HF + "/actb-pose-landmarker/resolve/main/pose_landmarker_lite.task", "PoseLandmarker", {}),
  ]);
  models = { face, pose }; return models;
}

$("go").addEventListener("click", async () => {
  if (!bmp) return;
  $("go").disabled = true;
  try {
    status("AI 正在看你的照片…");
    const { face, pose } = await loadModels();
    const fr = face.detect(bmp), pr = pose.detect(bmp);
    buildPlans(fr, pr);
    showPlan(0);
    $("result").style.display = "block";
    status("分析完成 ✓ 点选下方方案可切换构图");
  } catch (e) { status("分析失败: " + (e.message || e)); }
  $("go").disabled = false;
});

function bodyInfo(pr) {
  const ls = (pr.landmarks || [])[0];
  if (!ls) return null;
  let minX=1,maxX=0,minY=1,maxY=0;
  for (const p of ls) if (p.visibility === undefined || p.visibility > 0.4) {
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
  }
  return { minX, maxX, minY, maxY, h: maxY-minY, w: maxX-minX, cx:(minX+maxX)/2 };
}
function faceInfo(fr) {
  const ls = (fr.faceLandmarks || [])[0];
  if (!ls) return null;
  const nose = ls[1], le = ls[33], re = ls[263];
  return { nose, facing: (nose.x*1) >= (le.x+re.x)/2 ? 1 : -1, eyesMid: (le.x+re.x)/2, top: Math.min(...ls.map(p=>p.y)) };
}

function buildPlans(fr, pr) {
  const body = bodyInfo(pr), face = faceInfo(fr);
  const iw = bmp.width, ih = bmp.height;
  plans = [];
  if (body) {
    const bodyPx = body.h * ih;                      // 人物像素高
    // 七分身: 裁到膝盖上方, 人物高约占画面 78%; 焦段感 1.5x
    const sevenH = bodyPx * 0.78 / 0.78 * 1.02;      // 包含躯干到大腿中
    const mkPlan = (name, focal, side, cropH) => {
      const cropW = Math.min(iw, cropH * r(side));
      const cx = side === "L" ? body.cx*iw - cropW*0.5 + iw*0.05*(face&&face.facing<0?-1:1)
               : side === "R" ? body.cx*iw - cropW*0.5 - iw*0.05*(face&&face.facing>0?-1:1)
               : body.cx*iw - cropW/2;
      let x = Math.max(0, Math.min(iw - cropW, cx));
      let y = Math.max(0, Math.min(ih - cropH, (body.maxY*ih) - cropH*0.92));  // 脚踝留白 8%
      return { name, focal, side, x, y, w: cropW, h: cropH };
    };
    const r = () => 3/4;
    plans.push({ ...mkPlan("七分身", "1.5x", face && face.facing > 0 ? "R" : "L", Math.min(ih, bodyPx * 0.95)), why: "人物落在{SIDE}三分线，膝盖上方收口（七分身），视线方向留白，画面舒展有故事感" });
    plans.push({ ...mkPlan("半身", "2x", "C", Math.min(ih, bodyPx * 0.55)), why: "半身景别聚焦人物状态与服饰细节，背景虚化层次让主体更突出" });
    plans.push({ ...mkPlan("全身", "1.0x", "C", ih * Math.min(1, (body.h*ih) / (ih*0.86) + 0.14)), why: "全身居中构图，带出环境氛围，人景融合适合记录感" });
  } else if (face) {
    const f = faceInfo(fr);
    plans.push({ name: "特写", focal: "2.5x", x: Math.max(0, f.nose.x*iw - iw*0.35), y: Math.max(0, f.top*ih - ih*0.12), w: iw*0.7, h: iw*0.7*(4/3), why: "面部特写：眉眼是画面重心，上方留少量头空" });
  } else {
    plans.push({ name: "居中", focal: "1x", x: iw*0.15, y: ih*0.1, w: iw*0.7, h: ih*0.8, why: "未检出人物：给出中心裁切参考" });
  }
  // 裁切窗合法性: 不越界
  for (const p of plans) {
    p.w = Math.min(p.w, iw); p.h = Math.min(p.h, ih);
    p.x = Math.max(0, Math.min(iw - p.w, p.x)); p.y = Math.max(0, Math.min(ih - p.h, p.y));
    p.sideText = p.side === "L" ? "左三分" : p.side === "R" ? "右三分" : "居中";
  }
}

function showPlan(i) {
  activePlan = i;
  const p = plans[i];
  document.querySelectorAll(".scheme").forEach((el, k) => el.classList.toggle("active", k === i));
  // before
  const cb = $("cBefore"); cb.width = 480; cb.height = Math.round(480 * bmp.height / bmp.width);
  cb.getContext("2d").drawImage(bmp, 0, 0, cb.width, cb.height);
  // after: 裁切渲染 (含三分线)
  const ca = $("cAfter"); ca.width = 480; ca.height = Math.round(480 * p.h / p.w);
  const ctx = ca.getContext("2d");
  ctx.drawImage(bmp, p.x, p.y, p.w, p.h, 0, 0, ca.width, ca.height);
  ctx.strokeStyle = "rgba(232,236,241,.35)"; ctx.lineWidth = 1;
  for (const f of [1/3, 2/3]) {
    ctx.beginPath(); ctx.moveTo(f*ca.width, 0); ctx.lineTo(f*ca.width, ca.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, f*ca.height); ctx.lineTo(ca.width, f*ca.height); ctx.stroke();
  }
  // 讲解文案 (原创模板)
  const why = p.why.replace("{SIDE}", p.sideText);
  $("explain").innerHTML = `<b>构图思路 · ${p.name} · ${p.focal} · ${p.sideText}</b><br>${why}<br><span style="color:var(--sub);font-size:.8rem">依据: 关节安全(裁口避开脚踝/膝盖) · 三分 placement · 视线留白</span>`;
  if (!$("schemes").children.length) {
    $("schemes").innerHTML = plans.map((pl, k) => `<div class="scheme" data-k="${k}"><b>${pl.name}</b><span>${pl.focal} · ${pl.sideText}</span></div>`).join("");
    $("schemes").onclick = e => { const d = e.target.closest(".scheme"); if (d) showPlan(+d.dataset.k); };
  } else {
    document.querySelectorAll(".scheme").forEach(el => el.classList.toggle("active", +el.dataset.k === i));
  }
  $("save").onclick = () => {
    const a = document.createElement("a");
    a.download = "ai-composition-" + p.name + ".png";
    a.href = ca.toDataURL("image/png"); a.click();
  };
}
</script>
</body>
</html>
