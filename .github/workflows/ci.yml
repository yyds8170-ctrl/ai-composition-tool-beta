name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验文档与页面结构
        run: |
          echo "CI 占位：HTML 结构校验 / 链接检查 / 文案扫描 将在阶段1后半补全"
          ls -la
          test -f README.md && test -f public/index.html && echo "骨架完整"
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
